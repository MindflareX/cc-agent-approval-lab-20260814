name: agent-approval-check

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action/agent-approval-check@e63208cb983318a44e3f945e959ef894b707dcfa
        with:
          required_approvals: 2
          agent_emails: noreply@anthropic.com
          agent_logins: github-actions[bot]
